  <body>
    <!--
      ───────────────────────────────────────────────────────────────
      DIRECCIÓN (contrato · impeccable new-work redesign · seed a0a1eac2)
      Elegida por el cliente: "La línea de puntos". No es un mood.

      THESIS         El examen de la vista hecho visible: un campo de puntos de
                     colores que se resuelve en un mensaje que puedes (o casi)
                     leer — porque leer lo que hay en los puntos es lo que mide
                     esta óptica. Rechaza: azul médico, foto de familia feliz,
                     tres tarjetas de features.
      OWN-WORLD      Fondo papel cálido (#f6f2e9). La paleta REAL del test de
                     Ishihara — terracota, salvia, ocre, arcilla, teal apagado —
                     solo en campos de puntos, nunca como relleno plano. Tinta
                     #26231d. Un acento arcilla #bf5636 para la acción. Display
                     Bricolage Grotesque (carácter óptico), texto Hanken Grotesk,
                     cifras Spline Sans Mono tabular. División por filete de 1px,
                     NUNCA por sombra de tarjeta. Foto real a sangre, grado cálido.
      STORY          Entiendes al instante que aquí se prueba cómo ves. Bajas y
                     ves qué mide una revisión y cómo se elige montura —
                     enseñado, no afirmado. Reservas cita: única acción, siempre
                     lo más legible de la pantalla, siempre con aire alrededor.
      FIRST VIEWPORT Campo de puntos a sangre, paleta cálida. Titular corto que
                     se RESUELVE saliendo de los puntos (~1s, con imagen residual
                     al asentarse) y queda como texto limpio. "Pide cita" debajo,
                     sola. Tira reglada: [ciudad] · [teléfono] · hoy hasta 20:30.
                     reduced-motion: mensaje ya resuelto, una imagen fija.
      FORM           Mosaico de ciencia de la visión (lámina de Ishihara). Nº 7/7
                     de la lista por resonancia; seed a0a1eac2. Subidas de listón:
                     · [tablón ferroviario] horarios/disponibilidad como tabla
                       real ordenada por hora; división por filete.
                     · [Ikeda datamatics] toda cifra en mono tabular; reduced-
                       motion = una imagen fija de alto contraste, decidida.
                     · [estela de plancton] persistencia de la visión: el mensaje
                       deja imagen residual; las interacciones dejan una marca
                       que se desvanece.
                     · [consola dark-first] "Pide cita" siempre aislada con aire.
                     · [cartel pintado] la voz de display es lettering con
                       carácter óptico, no una fuente segura (Bricolage Grotesque).
      FINISH         unreviewed and undocumented is unfinished; this build ends
                     with the finish review, the verdict, DESIGN.md, and every
                     shipping raster carrying its provenance.

      DEMO: marca ficticia. Fotos = stock de Unsplash marcado para sustituir
      (ver src/data/media.js). Formulario de cita sin backend todavía.
      ───────────────────────────────────────────────────────────────
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
